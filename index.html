<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eyes</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="stage">
      <canvas id="portrait" hidden></canvas>
      <div id="empty">
        <h1>Eyes</h1>
        <p>Drop a headshot here, then turn on the camera. The eyes will follow whoever stands in front of it.</p>
        <div class="row">
          <label class="btn primary">Upload photo<input id="file" type="file" accept="image/*" hidden /></label>
          <button class="btn" id="sample">Try the Mona Lisa</button>
        </div>
      </div>
      <p id="status" role="status"></p>
    </main>

    <video id="cam" playsinline muted hidden></video>

    <nav id="bar">
      <label class="btn">Photo<input id="file2" type="file" accept="image/*" hidden /></label>
      <button class="btn primary" id="camera">Start camera</button>
      <button class="btn" id="settings-toggle" aria-expanded="false">Settings</button>
      <button class="btn" id="fullscreen">Fullscreen</button>
    </nav>

    <section id="settings" hidden>
      <label>Sensitivity <input id="sensitivity" type="range" min="0.4" max="2.5" step="0.05" value="1.3" /></label>
      <label>Camera above photo <input id="cameraOffset" type="range" min="-10" max="25" step="1" value="8" /></label>
      <label>Smoothing <input id="smoothing" type="range" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>Head turn <input id="headTurn" type="range" min="0" max="1" step="0.05" value="0.5" /></label>
      <label class="check"><input id="reactions" type="checkbox" checked /> React (pupils, surprise, glance away when stared at)</label>
      <label class="check"><input id="autoBlink" type="checkbox" checked /> Blink on its own</label>
      <label class="check"><input id="mirrorBlink" type="checkbox" checked /> Copy my blinks and winks</label>
      <label class="check"><input id="debug" type="checkbox" /> Debug overlay (D)</label>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
